name: CI

on:
  push:
    # develop is the integration branch - the previous workflow watched main only, so
    # everything merged into develop went unbuilt until release time.
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only by default. No job here publishes anything; a token that cannot write is
# one less thing an untrusted pull request can abuse.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test microservices (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The integration tests run MongoDB through Testcontainers, so the build needs a
      # working Docker daemon. ubuntu-latest runners ship one and the runner user is in
      # the docker group, so nothing has to be installed or started here. A container-
      # based or self-hosted runner without Docker would fail at the first @Testcontainers
      # class, not at compile time.
      #
      # ./mvnw, not mvn: the wrapper pins the Maven version, so CI and laptops run the
      # same build. `verify` is what actually executes the tests - `package` does not.
      - name: Build and test
        working-directory: app/backend/microservices
        run: ./mvnw -B -ntp verify

      # Only on failure: on a green build nobody reads these, and they are megabytes.
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: app/backend/microservices/**/target/surefire-reports/**
          retention-days: 7
          if-no-files-found: ignore

  openapi:
    name: Lint OpenAPI contracts
    runs-on: ubuntu-latest

    # Independent of the Java build on purpose: the specs are the contract the mobile
    # team and the Prism mocks build against, so they must be checked even when the
    # backend build is broken.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # @redocly/cli exposes more than one bin, so a bare `npx @redocly/cli@latest`
      # cannot pick one and errors out. --package names the package, `redocly` the bin.
      - name: Lint specs
        run: npx --package=@redocly/cli@latest redocly lint docs/api/*.yaml
