<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF;">

        <div style="font-size: 13px; line-height: 16px; font-weight: 600; color: #6B6472;">Correo institucional</div>

          <span style="font-size: 16px; color: #C4BDCA;">@konradlorenz.edu.co</span>
