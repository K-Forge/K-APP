server:
  port: ${SERVER_PORT:8082}
  # Makes springdoc emit gateway-relative server URLs instead of this container's own
  # host, so "Try it out" in the aggregated Swagger UI goes through the gateway.
  forward-headers-strategy: framework

spring:
  application:
    name: user-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/kapp_user}
      auto-index-creation: false   # indexes are declared in Mongock change units

  security:
    oauth2:
      resourceserver:
        jwt:
          # MUST be jwk-set-uri, never issuer-uri. issuer-uri performs OIDC discovery
          # while the bean is created, so this service would refuse to start unless
          # auth-service were already up - a boot-order deadlock under docker compose.
          jwk-set-uri: ${KAPP_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

kapp:
  internal:
    # Shared secret guarding /internal/** in both directions: POST /internal/users here, which
    # auth-service calls during registration, and PATCH /internal/credentials/{id}/status there,
    # which this service calls when an administrator deactivates an account. All three services
    # must hold the same value. Left empty the service still starts, warns once and rejects
    # every internal request with 401: an unset secret must never read as "no check needed".
    token: ${KAPP_INTERNAL_TOKEN:}

  user:
    # Blank means "resolve auth-service through Eureka", the production path. A test or a
    # local run can point this at a stub instead.
    auth-service-url: ${KAPP_AUTH_SERVICE_URL:}

mongock:
  migration-scan-package: co.edu.konradlorenz.kapp.user.migration
  # Left off deliberately: the change units only create indexes, which are idempotent,
  # and enabling transactions requires a MongoTransactionManager bean.
  # Property is `transactional`; `transaction-enabled` is deprecated in Mongock 5.5.
  transactional: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    # Registering with Eureka is pointless in tests and slows them down.
    enabled: ${EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    co.edu.konradlorenz.kapp: ${KAPP_LOG_LEVEL:INFO}
