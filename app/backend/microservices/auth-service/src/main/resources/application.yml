server:
  port: ${SERVER_PORT:8081}
  # Makes springdoc emit gateway-relative server URLs instead of this container's own
  # host, so "Try it out" in the aggregated Swagger UI goes through the gateway.
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/kapp_auth}
      auto-index-creation: false   # indexes are declared in Mongock change units

  security:
    oauth2:
      resourceserver:
        jwt:
          # MUST be jwk-set-uri, never issuer-uri. issuer-uri performs OIDC discovery
          # while the bean is created, so this service would refuse to start unless
          # auth-service were already up - a boot-order deadlock under docker compose.
          jwk-set-uri: ${KAPP_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

mongock:
  migration-scan-package: co.edu.konradlorenz.kapp.auth.migration
  # Left off deliberately: the change units only create indexes, which are idempotent,
  # and enabling transactions requires a MongoTransactionManager bean.
  # Property is `transactional`; `transaction-enabled` is deprecated in Mongock 5.5.
  transactional: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    # Registering with Eureka is pointless in tests and slows them down.
    enabled: ${EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    co.edu.konradlorenz.kapp: ${KAPP_LOG_LEVEL:INFO}

kapp:
  auth:
    jwt:
      # Base64-encoded PEM. Leave blank locally and an ephemeral pair is generated,
      # with a warning: every restart then invalidates all tokens already issued.
      private-key: ${KAPP_JWT_PRIVATE_KEY:}
      public-key: ${KAPP_JWT_PUBLIC_KEY:}
      key-id: ${KAPP_JWT_KEY_ID:kapp-signing-key}
      ttl: ${KAPP_JWT_TTL:1h}
      issuer: ${KAPP_JWT_ISSUER:https://kapp.konradlorenz.edu.co}
